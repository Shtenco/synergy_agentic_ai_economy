name: Historical block V4 exact gas replay

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/historical-block-v4-exact-gas
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-v4:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install replay dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pyarrow requests

      - name: Run V4 historical replay
        run: |
          python experiments/closed_multimarket_hardnav_v4.py

      - name: Validate generated evidence
        run: |
          python - <<'PY'
          import csv, json, pathlib
          report = pathlib.Path("reports/closed_multimarket_hardnav_v4/seed77_10000_train_3000_oos.json")
          manifest = pathlib.Path("data/real_backtest_v4/manifest.json")
          csv_path = pathlib.Path("data/real_backtest_v4/ethereum_23544921_23557920_exact_gas_real_prices.csv")
          assert report.is_file() and manifest.is_file() and csv_path.is_file()
          r = json.loads(report.read_text())
          assert r["ethereum_blocks"]["count"] == 13000
          assert r["ethereum_blocks"]["contiguous"] is True
          assert r["protocol"]["train_blocks"] == 10000
          assert r["protocol"]["oos_blocks"] == 3000
          assert r["protocol"]["hedge_anchor_selection"]["oos_used_for_selection"] is False
          assert r["market_inputs"]["factor_mapped_assets"] == []
          assert len(r["market_inputs"]["provenance"]) == 10
          assert set(r["gas_input"]["exact_fields"]) == {
              "block_date_time", "gas_used", "gas_limit", "base_fee_per_gas"
          }
          with csv_path.open(newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 13000
          assert int(rows[0]["block_number"]) == 23544921
          assert int(rows[-1]["block_number"]) == 23557920
          print("V4 EVIDENCE GATES: PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: historical-block-v4-exact-gas
          path: |
            data/real_backtest_v4/
            reports/closed_multimarket_hardnav_v4/
          retention-days: 30
