name: Build real-block backtest inputs

on:
  push:
    branches:
      - feat/real-block-backtest-data
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Fetch real Ethereum block dataset from public Git LFS source
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-lfs
          git lfs install
          export GIT_LFS_SKIP_SMUDGE=1
          git clone --depth 1 https://github.com/chainbound/taiko-priority-fee.git /tmp/taiko-priority-fee
          cd /tmp/taiko-priority-fee
          git lfs pull --include="ethereum__blocks__21453417_to_22779884.csv"
          test -s ethereum__blocks__21453417_to_22779884.csv
          mkdir -p "$GITHUB_WORKSPACE/real_backtest_inputs"
          cp ethereum__blocks__21453417_to_22779884.csv "$GITHUB_WORKSPACE/real_backtest_inputs/source_blocks.csv"

      - name: Select 13,000 contiguous real blocks and fetch real prices
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, os, time, urllib.parse, urllib.request
          from datetime import datetime, timezone

          src='real_backtest_inputs/source_blocks.csv'
          out='real_backtest_inputs/ethereum_blocks_22000000_22012999.csv'
          start_block=22_000_000
          end_block=22_012_999

          with open(src, newline='', encoding='utf-8') as f:
              reader=csv.DictReader(f)
              fields=reader.fieldnames or []
              number_key=next((k for k in fields if k in ('block_number','number','id')), None)
              timestamp_key=next((k for k in fields if k in ('timestamp','block_timestamp')), None)
              if not number_key or not timestamp_key:
                  raise RuntimeError(f'Unsupported block schema: {fields}')
              rows=[]
              for row in reader:
                  n=int(row[number_key])
                  if start_block <= n <= end_block:
                      rows.append(row)
              if len(rows) != 13000:
                  raise RuntimeError(f'Expected 13000 blocks, got {len(rows)}')
              rows.sort(key=lambda r:int(r[number_key]))
              with open(out,'w',newline='',encoding='utf-8') as g:
                  w=csv.DictWriter(g,fieldnames=fields)
                  w.writeheader(); w.writerows(rows)

          def parse_ts(v):
              v=str(v)
              if v.isdigit():
                  return int(v)
              return int(datetime.fromisoformat(v.replace('Z','+00:00')).timestamp())

          t0=parse_ts(rows[0][timestamp_key])
          t1=parse_ts(rows[-1][timestamp_key])

          # Binance 1-minute real historical closes, with Coinbase fallback.
          def binance(symbol):
              data=[]
              cursor=t0*1000
              end=t1*1000
              while cursor <= end:
                  params=urllib.parse.urlencode({
                      'symbol':symbol,'interval':'1m','startTime':cursor,'endTime':end,'limit':1000
                  })
                  url='https://api.binance.com/api/v3/klines?'+params
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      batch=json.load(r)
                  if not batch: break
                  for x in batch:
                      data.append((int(x[0]//1000),float(x[4])))
                  nxt=int(batch[-1][0])+60_000
                  if nxt<=cursor: break
                  cursor=nxt
                  time.sleep(.15)
              return data

          def coinbase(product):
              data=[]
              cursor=t0
              while cursor <= t1:
                  chunk_end=min(t1,cursor+299*60)
                  s=datetime.fromtimestamp(cursor,timezone.utc).isoformat().replace('+00:00','Z')
                  e=datetime.fromtimestamp(chunk_end,timezone.utc).isoformat().replace('+00:00','Z')
                  params=urllib.parse.urlencode({'granularity':60,'start':s,'end':e})
                  url=f'https://api.exchange.coinbase.com/products/{product}/candles?'+params
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      batch=json.load(r)
                  for x in batch:
                      data.append((int(x[0]),float(x[4])))
                  cursor=chunk_end+60
                  time.sleep(.12)
              return sorted(set(data))

          try:
              btc=binance('BTCUSDT')
              eth=binance('ETHUSDT')
              price_source='Binance public klines'
              if len(btc)<100 or len(eth)<100:
                  raise RuntimeError('insufficient Binance rows')
          except Exception as exc:
              print('Binance failed, using Coinbase:',repr(exc))
              btc=coinbase('BTC-USD')
              eth=coinbase('ETH-USD')
              price_source='Coinbase Exchange public candles'

          by_btc=dict(btc); by_eth=dict(eth)
          minutes=sorted(set(by_btc)&set(by_eth))
          if not minutes:
              raise RuntimeError('No overlapping real price data')
          price_out='real_backtest_inputs/prices_1m.csv'
          with open(price_out,'w',newline='',encoding='utf-8') as f:
              w=csv.writer(f); w.writerow(['timestamp','btc_usd','eth_usd','weth_usd'])
              for ts in minutes:
                  w.writerow([ts,by_btc[ts],by_eth[ts],by_eth[ts]])

          manifest={
              'classification':'REAL-BLOCK MARKET INPUTS',
              'ethereum_source_repo':'chainbound/taiko-priority-fee',
              'ethereum_source_file':'ethereum__blocks__21453417_to_22779884.csv',
              'block_start':start_block,
              'block_end':end_block,
              'block_count':len(rows),
              'timestamp_start':t0,
              'timestamp_end':t1,
              'price_source':price_source,
              'price_rows':len(minutes),
              'train_blocks':10000,
              'oos_blocks':3000,
              'continuous_no_reset':True,
              'agent_external_activity':'MODELED_FROM_REPOSITORY_SEMANTICS_NOT_HISTORICAL_MARKETPLACE_LOGS'
          }
          with open('real_backtest_inputs/manifest.json','w',encoding='utf-8') as f:
              json.dump(manifest,f,indent=2)
          print(json.dumps(manifest,indent=2))
          PY
          rm -f real_backtest_inputs/source_blocks.csv

      - name: Validate continuity
        shell: bash
        run: |
          python - <<'PY'
          import csv, json
          p='real_backtest_inputs/ethereum_blocks_22000000_22012999.csv'
          with open(p,newline='',encoding='utf-8') as f:
              r=csv.DictReader(f)
              fields=r.fieldnames or []
              k=next(x for x in fields if x in ('block_number','number','id'))
              nums=[int(row[k]) for row in r]
          assert len(nums)==13000
          assert nums[0]==22000000 and nums[-1]==22012999
          assert all(b==a+1 for a,b in zip(nums,nums[1:]))
          print('CONTIGUOUS REAL BLOCKS: PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: real-block-inputs-22000000-22012999
          path: real_backtest_inputs/
          retention-days: 30
